<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Architects · Archive</title>
<meta name="description" content="Complete archive of the Agent Architects Skool community: courses, live call transcripts, tools/skills, and curated community posts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
  :root {
    --bg: #07070a;
    --bg-2: #0e0e12;
    --surface: #14141a;
    --surface-hi: #1c1c24;
    --border: #26262e;
    --border-hi: #34343f;
    --text: #f5f5f7;
    --text-dim: #a1a1aa;
    --text-dimmer: #6b6b75;
    --accent: #a78bfa;
    --accent-2: #60a5fa;
    --green: #34d399;
  }
  *,*::before,*::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  ::selection { background: var(--accent); color: #0a0a0a; }
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167,139,250,0.18), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(96,165,250,0.10), transparent 60%);
  }
  body > * { position: relative; z-index: 1; }

  .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 640px) { .container { padding: 0 20px; } }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    background: rgba(7,7,10,0.72);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 60px; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); text-decoration: none; font-size: 15px; cursor: pointer; }
  .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); display: grid; place-items: center; font-family: 'Instrument Serif', serif; font-size: 18px; color: #0a0a0a; font-weight: 600; }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab { background: transparent; border: 0; color: var(--text-dim); font: inherit; font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: all .15s; }
  .nav-tab:hover { color: var(--text); background: var(--surface); }
  .nav-tab.active { color: var(--text); background: var(--surface-hi); }
  .nav-search { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; color: var(--text); font: inherit; font-size: 13px; width: 240px; transition: border-color .15s; }
  .nav-search:focus { outline: none; border-color: var(--accent); }
  .nav-search::placeholder { color: var(--text-dimmer); }
  @media (max-width: 760px) { .nav-tabs { display: none; } .nav-search { width: 140px; } }

  /* Hero */
  .hero { padding: 80px 0 56px; border-bottom: 1px solid var(--border); }
  .hero-eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); padding: 6px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; margin-bottom: 24px; }
  .hero-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .hero h1 { font-family: 'Instrument Serif', serif; font-size: clamp(48px, 8vw, 96px); font-weight: 400; line-height: 1; letter-spacing: -0.03em; margin: 0 0 24px; max-width: 14ch; }
  .hero h1 em { font-style: italic; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .hero p { font-size: 18px; line-height: 1.6; color: var(--text-dim); max-width: 60ch; margin: 0 0 40px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 40px; }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .stat-value { font-family: 'Instrument Serif', serif; font-size: 40px; line-height: 1; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 6px; }
  .stat-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

  /* Section */
  .section { padding: 64px 0; }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; gap: 32px; flex-wrap: wrap; }
  .section-head h2 { font-family: 'Instrument Serif', serif; font-size: 40px; font-weight: 400; letter-spacing: -0.02em; margin: 0; }
  .section-head p { color: var(--text-dim); margin: 0; font-size: 15px; }

  /* Grid */
  .grid { display: grid; gap: 16px; }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 920px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

  .card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; cursor: pointer; transition: transform .25s, border-color .25s, background .25s; text-align: left; color: inherit; font: inherit; width: 100%; }
  .card:hover { transform: translateY(-2px); border-color: var(--border-hi); background: var(--surface-hi); }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--card-accent, var(--accent)), transparent); opacity: 0.4; }
  .card-icon { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; font-family: 'Instrument Serif', serif; font-size: 22px; font-weight: 600; background: color-mix(in srgb, var(--card-accent, var(--accent)) 14%, transparent); color: var(--card-accent, var(--accent)); border: 1px solid color-mix(in srgb, var(--card-accent, var(--accent)) 22%, transparent); margin-bottom: 20px; }
  .card-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; }
  .card-subtitle { font-size: 13px; color: var(--text-dim); margin: 0 0 16px; }
  .card-desc { font-size: 14px; color: var(--text-dim); line-height: 1.55; margin: 0 0 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 4px 9px; border-radius: 100px; color: var(--text-dim); background: var(--bg-2); border: 1px solid var(--border); letter-spacing: 0.02em; }
  .badge.accent { color: var(--card-accent, var(--accent)); background: color-mix(in srgb, var(--card-accent, var(--accent)) 10%, transparent); border-color: color-mix(in srgb, var(--card-accent, var(--accent)) 25%, transparent); }
  .featured .card { padding: 32px; }
  .featured .card-icon { width: 56px; height: 56px; font-size: 28px; border-radius: 14px; margin-bottom: 28px; }
  .featured .card-title { font-size: 24px; }
  .featured .card-subtitle { font-size: 14px; margin-bottom: 18px; }

  /* Detail view */
  .view { display: block; padding: 32px 0 96px; }
  .view-head { display: flex; gap: 24px; align-items: flex-start; padding-bottom: 32px; border-bottom: 1px solid var(--border); margin-bottom: 32px; flex-wrap: wrap; }
  .view-icon { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font-family: 'Instrument Serif', serif; font-size: 30px; font-weight: 600; background: color-mix(in srgb, var(--card-accent, var(--accent)) 14%, transparent); color: var(--card-accent, var(--accent)); border: 1px solid color-mix(in srgb, var(--card-accent, var(--accent)) 22%, transparent); flex-shrink: 0; }
  .view-head-text { flex: 1; min-width: 260px; }
  .view-head h2 { font-family: 'Instrument Serif', serif; font-size: 52px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1; }
  .view-head .subtitle { color: var(--text-dim); font-size: 16px; margin: 0 0 16px; }
  .view-head .desc { color: var(--text-dim); font-size: 15px; max-width: 70ch; }
  .back-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); font: inherit; font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 8px; cursor: pointer; margin-bottom: 24px; transition: all .15s; }
  .back-btn:hover { color: var(--text); border-color: var(--border-hi); background: var(--surface-hi); }
  .layout-2col { display: grid; grid-template-columns: 280px 1fr; gap: 40px; align-items: flex-start; }
  @media (max-width: 900px) { .layout-2col { grid-template-columns: 1fr; } }

  .lesson-list { position: sticky; top: 80px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; max-height: calc(100vh - 100px); overflow-y: auto; }
  .lesson-section { font-size: 11px; font-weight: 600; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.08em; padding: 14px 12px 6px; }
  .lesson-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 13.5px; color: var(--text-dim); cursor: pointer; transition: all .12s; line-height: 1.4; }
  .lesson-item:hover { background: var(--bg-2); color: var(--text); }
  .lesson-item.active { background: color-mix(in srgb, var(--card-accent, var(--accent)) 14%, transparent); color: var(--text); }
  .lesson-num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-weight: 600; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-dim); }
  .lesson-item.active .lesson-num { background: var(--card-accent, var(--accent)); color: #0a0a0a; border-color: var(--card-accent, var(--accent)); }

  .reader { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 48px 56px; min-height: 60vh; }
  @media (max-width: 760px) { .reader { padding: 28px 24px; } }
  .reader .empty { text-align: center; color: var(--text-dim); padding: 80px 0; }
  .reader .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .reader-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }

  .prose { font-size: 15.5px; line-height: 1.7; color: var(--text); max-width: 70ch; }
  .prose h1 { font-family: 'Instrument Serif', serif; font-size: 42px; font-weight: 400; letter-spacing: -0.02em; margin: 0 0 24px; line-height: 1.1; }
  .prose h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin: 40px 0 16px; }
  .prose h3 { font-size: 18px; font-weight: 600; margin: 28px 0 12px; }
  .prose h4 { font-size: 15px; font-weight: 600; margin: 24px 0 10px; }
  .prose p { margin: 0 0 16px; color: #e4e4e7; }
  .prose ul, .prose ol { padding-left: 22px; margin: 0 0 16px; color: #e4e4e7; }
  .prose li { margin: 6px 0; }
  .prose strong { color: var(--text); font-weight: 600; }
  .prose a { color: var(--accent-2); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent-2) 40%, transparent); transition: border-color .15s; }
  .prose a:hover { border-bottom-color: var(--accent-2); }
  .prose code { font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--bg-2); border: 1px solid var(--border); padding: 2px 6px; border-radius: 5px; }
  .prose pre { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; overflow-x: auto; margin: 18px 0; }
  .prose pre code { background: transparent; border: 0; padding: 0; font-size: 13px; line-height: 1.6; }
  .prose blockquote { border-left: 3px solid var(--accent); padding: 4px 0 4px 18px; color: var(--text-dim); margin: 16px 0; font-style: italic; }
  .prose hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
  .prose img { max-width: 100%; border-radius: 8px; }

  /* Live calls */
  .calls-list { display: flex; flex-direction: column; gap: 8px; }
  .call-item { display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; cursor: pointer; transition: all .15s; text-align: left; color: inherit; font: inherit; width: 100%; }
  .call-item:hover { border-color: var(--border-hi); background: var(--surface-hi); transform: translateX(4px); }
  .call-date { flex-shrink: 0; width: 56px; text-align: center; font-family: 'Instrument Serif', serif; font-size: 14px; color: var(--text-dim); line-height: 1.2; }
  .call-date .day { font-size: 24px; color: var(--text); display: block; font-weight: 400; }
  .call-content { flex: 1; min-width: 0; }
  .call-title { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
  .call-section { font-size: 12px; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.06em; }
  .call-badges { display: flex; gap: 6px; flex-shrink: 0; }

  /* Community posts */
  .posts-list { display: flex; flex-direction: column; gap: 6px; }
  .post-item { display: grid; grid-template-columns: 60px 1fr auto; gap: 16px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; cursor: pointer; transition: all .15s; text-align: left; color: inherit; font: inherit; width: 100%; }
  .post-item:hover { border-color: var(--border-hi); background: var(--surface-hi); }
  .post-votes { text-align: center; color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .post-votes .num { display: block; font-size: 20px; font-weight: 400; color: var(--text); font-family: 'Instrument Serif', serif; line-height: 1; margin-bottom: 2px; }
  .post-title { font-size: 14.5px; font-weight: 500; margin: 0; }
  .post-meta { font-size: 12px; color: var(--text-dimmer); margin-top: 2px; }
  .post-comments { color: var(--text-dim); font-size: 13px; }

  .loading { text-align: center; padding: 80px 0; color: var(--text-dim); }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { border-top: 1px solid var(--border); padding: 40px 0; color: var(--text-dimmer); font-size: 13px; text-align: center; }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--text); }

  .search-result-cat { font-size: 11px; font-weight: 600; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: 0.08em; margin: 24px 0 8px; }
</style>
</head>
<body>

<nav class="nav">
  <div class="container nav-inner">
    <a class="brand" onclick="goHome();return false;">
      <div class="brand-mark">A</div>
      <span>Agent Architects · Archive</span>
    </a>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="courses">Courses</button>
      <button class="nav-tab" data-tab="calls">Live Calls</button>
      <button class="nav-tab" data-tab="community">Community</button>
    </div>
    <input class="nav-search" type="search" placeholder="Search everything…" id="search" />
  </div>
</nav>

<main id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading archive…</div>
  </div>
</main>

<footer>
  <div class="container">
    Archive of <a href="https://www.skool.com/agent-architects" target="_blank" rel="noopener">skool.com/agent-architects</a> · scraped May 19, 2026 · <a href="https://github.com/marcusinthewarehouse/skool-claude-lessons" target="_blank" rel="noopener">source on GitHub</a>
  </div>
</footer>

<script>
let DATA = null;
let currentTab = 'courses';
let currentCourse = null;
let currentLessonIdx = 0;
let searchQuery = '';

const app = document.getElementById('app');

async function loadData() {
  try {
    const r = await fetch('data.json');
    DATA = await r.json();
    renderHome();
  } catch (e) {
    app.innerHTML = `<div class="container section"><div class="reader"><h2>Failed to load data</h2><p style="color:var(--text-dim)">${e.message}</p></div></div>`;
  }
}

function goHome() {
  currentCourse = null;
  currentLessonIdx = 0;
  searchQuery = '';
  document.getElementById('search').value = '';
  renderHome();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setTab(tab) {
  currentTab = tab;
  currentCourse = null;
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderHome();
}

document.querySelectorAll('.nav-tab').forEach(b => {
  b.addEventListener('click', () => setTab(b.dataset.tab));
});

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  if (searchQuery.length >= 2) renderSearch();
  else if (!currentCourse) renderHome();
});

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHome() {
  if (searchQuery.length >= 2) return renderSearch();
  if (currentTab === 'courses') return renderCoursesHome();
  if (currentTab === 'calls') return renderCallsHome();
  if (currentTab === 'community') return renderCommunityHome();
}

function renderCoursesHome() {
  const s = DATA.meta.stats;
  const featured = DATA.courses.filter(c => c.featured);
  const others = DATA.courses.filter(c => !c.featured);

  app.innerHTML = `
    <section class="hero">
      <div class="container">
        <div class="hero-eyebrow"><span class="dot"></span> archived may 19, 2026</div>
        <h1>Everything from <em>Agent Architects</em>.</h1>
        <p>The complete archive of Daniel's Skool community — every course, every live call transcript, every tool/skill release, and the most-discussed community posts.</p>
        <div class="stats">
          <div class="stat"><div class="stat-value">${s.courses}</div><div class="stat-label">Courses</div></div>
          <div class="stat"><div class="stat-value">${s.lessons}</div><div class="stat-label">Lessons</div></div>
          <div class="stat"><div class="stat-value">${s.transcripts}</div><div class="stat-label">Transcripts</div></div>
          <div class="stat"><div class="stat-value">${s.guides}</div><div class="stat-label">Guides</div></div>
          <div class="stat"><div class="stat-value">${s.community_posts}</div><div class="stat-label">Posts</div></div>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head"><h2>Featured</h2><p>The newest and most important courses.</p></div>
        <div class="grid grid-2 featured">${featured.map(courseCard).join('')}</div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head"><h2>All courses</h2><p>${DATA.courses.length} total · ${s.lessons} lessons</p></div>
        <div class="grid grid-3">${others.map(courseCard).join('')}</div>
      </div>
    </section>
  `;
}

function courseCard(c) {
  const lessons = c.lesson_count || 0;
  const transcripts = c.transcript_count || 0;
  const guides = c.guide_count || 0;
  return `
    <button class="card" style="--card-accent:${c.accent}" onclick="openCourse('${c.id}')">
      <div class="card-icon">${escapeHtml(c.icon)}</div>
      <h3 class="card-title">${escapeHtml(c.title)}</h3>
      <p class="card-subtitle">${escapeHtml(c.subtitle || '')}</p>
      <p class="card-desc">${escapeHtml(c.description || '')}</p>
      <div class="card-meta">
        ${lessons ? `<span class="badge accent">${lessons} lesson${lessons!==1?'s':''}</span>` : ''}
        ${transcripts ? `<span class="badge">${transcripts} transcript${transcripts!==1?'s':''}</span>` : ''}
        ${guides ? `<span class="badge">${guides} guide${guides!==1?'s':''}</span>` : ''}
      </div>
    </button>
  `;
}

function renderCallsHome() {
  const lcr = DATA.courses.find(c => c.id === 'live-call-recordings');
  if (!lcr) { app.innerHTML = '<div class="container section"><p>No live calls.</p></div>'; return; }
  const groups = {};
  for (const l of lcr.lessons) {
    const k = l.section || 'Calls';
    (groups[k] = groups[k] || []).push(l);
  }
  for (const k of Object.keys(groups)) {
    groups[k].sort((a,b) => (a.date || '').localeCompare(b.date || ''));
  }
  app.innerHTML = `
    <section class="hero">
      <div class="container">
        <div class="hero-eyebrow"><span class="dot"></span> live calls</div>
        <h1>Weekly community <em>conversations</em>.</h1>
        <p>Q&A and Think Tank calls from the Agent Architects community. Each call has a full transcript and a written summary of key topics, tools mentioned, and takeaways.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        ${Object.entries(groups).map(([sec, items]) => `
          <div style="margin-bottom: 40px;">
            <div class="section-head"><h2>${escapeHtml(sec)}</h2><p>${items.length} calls</p></div>
            <div class="calls-list">${items.map(callRow).join('')}</div>
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function callRow(l) {
  let day = '', mo = '';
  if (l.date) {
    const d = new Date(l.date);
    day = d.getDate();
    mo = d.toLocaleString('en-US', { month: 'short' });
  }
  return `
    <button class="call-item" onclick='openCourse("live-call-recordings", ${JSON.stringify(l.file)})'>
      <div class="call-date">${mo ? `<span class="day">${day}</span>${escapeHtml(mo)}` : '—'}</div>
      <div class="call-content">
        <div class="call-title">${escapeHtml(l.title)}</div>
        <div class="call-section">${escapeHtml(l.section || '')}</div>
      </div>
      <div class="call-badges">${l.has_transcript ? `<span class="badge accent" style="--card-accent:#60a5fa">transcript</span>` : ''}</div>
    </button>
  `;
}

function renderCommunityHome() {
  const posts = DATA.top_posts || [];
  const all = DATA.all_posts || [];
  app.innerHTML = `
    <section class="hero">
      <div class="container">
        <div class="hero-eyebrow"><span class="dot"></span> community posts</div>
        <h1>What the community is <em>actually</em> building.</h1>
        <p>${all.length} community posts archived. Showing the top ${posts.length} by engagement (upvotes + comments). The 12 most-engaged posts have inline community comments saved.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="section-head"><h2>Top posts</h2><p>By upvotes + comments</p></div>
        <div class="posts-list">${posts.map(postRow).join('')}</div>
      </div>
    </section>
  `;
}

function postRow(p) {
  return `
    <button class="post-item" onclick='openMarkdown(${JSON.stringify(p.file)}, ${JSON.stringify(p.title)})'>
      <div class="post-votes"><span class="num">${p.upvotes || 0}</span>upvotes</div>
      <div>
        <div class="post-title">${escapeHtml(p.title)}</div>
        <div class="post-meta">${escapeHtml(p.created || '')} ${p.pinned ? '· 📌 pinned' : ''}</div>
      </div>
      <div class="post-comments">${p.comments || 0} comments</div>
    </button>
  `;
}

function openCourse(id, openFile) {
  const c = DATA.courses.find(x => x.id === id);
  if (!c) return;
  currentCourse = c;
  let idx = 0;
  if (openFile) {
    const i = c.lessons.findIndex(l => l.file === openFile);
    if (i >= 0) idx = i;
  }
  currentLessonIdx = idx;
  renderCourseDetail();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCourseDetail() {
  const c = currentCourse;
  if (!c) { renderHome(); return; }
  const sections = {};
  c.lessons.forEach((l, idx) => {
    const k = l.section || '';
    (sections[k] = sections[k] || []).push({ ...l, idx });
  });

  const sidebar = `
    <aside class="lesson-list">
      ${Object.entries(sections).map(([sec, items]) => `
        ${sec ? `<div class="lesson-section">${escapeHtml(sec)}</div>` : ''}
        ${items.map(l => `
          <div class="lesson-item ${l.idx === currentLessonIdx ? 'active' : ''}" onclick="selectLesson(${l.idx})">
            <div class="lesson-num">${l.idx + 1}</div>
            <div>${escapeHtml(l.title)}</div>
          </div>
        `).join('')}
      `).join('')}
      ${c.guides && c.guides.length ? `
        <div class="lesson-section">Guides</div>
        ${c.guides.map(g => `
          <div class="lesson-item" onclick='openGuide(${JSON.stringify(g)})'>
            <div class="lesson-num">${escapeHtml((g.ext || 'doc').toUpperCase().slice(0,3))}</div>
            <div>${escapeHtml(g.name)}</div>
          </div>
        `).join('')}
      ` : ''}
      ${c.transcripts && c.transcripts.length ? `
        <div class="lesson-section">Transcripts</div>
        ${c.transcripts.map(t => `
          <div class="lesson-item" onclick='openTranscript(${JSON.stringify(t)})'>
            <div class="lesson-num">TXT</div>
            <div>${escapeHtml(t.name.replace(/call_transcript_/,'').replace(/_/g,' '))}</div>
          </div>
        `).join('')}
      ` : ''}
    </aside>
  `;

  app.innerHTML = `
    <section class="view">
      <div class="container">
        <button class="back-btn" onclick="goHome()">← All courses</button>
        <div class="view-head" style="--card-accent:${c.accent}">
          <div class="view-icon">${escapeHtml(c.icon)}</div>
          <div class="view-head-text">
            <h2>${escapeHtml(c.title)}</h2>
            <p class="subtitle">${escapeHtml(c.subtitle || '')}</p>
            <p class="desc">${escapeHtml(c.description || '')}</p>
          </div>
        </div>
        <div class="layout-2col">
          ${sidebar}
          <div class="reader" id="reader" style="--card-accent:${c.accent}">
            <div class="loading"><div class="spinner"></div><div>Loading…</div></div>
          </div>
        </div>
      </div>
    </section>
  `;
  loadCurrentLesson();
}

function selectLesson(idx) {
  currentLessonIdx = idx;
  renderCourseDetail();
}

async function loadCurrentLesson() {
  if (!currentCourse || !currentCourse.lessons.length) {
    const el = document.getElementById('reader');
    if (el) el.innerHTML = `<div class="empty"><div class="empty-icon">📁</div><p>No lessons in this course yet — check guides or transcripts in the sidebar.</p></div>`;
    return;
  }
  const l = currentCourse.lessons[currentLessonIdx];
  if (!l) return;
  try {
    const r = await fetch(l.file);
    const md = await r.text();
    renderMarkdownInto('reader', md, l);
  } catch (e) {
    document.getElementById('reader').innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Could not load lesson.</p></div>`;
  }
}

function renderMarkdownInto(elId, md, lesson) {
  const html = marked.parse(md, { gfm: true, breaks: true });
  const meta = lesson ? `
    <div class="reader-meta">
      ${lesson.date ? `<span class="badge">${lesson.date}</span>` : ''}
      ${lesson.section ? `<span class="badge">${escapeHtml(lesson.section)}</span>` : ''}
      ${lesson.videoId ? `<span class="badge accent">Video</span>` : ''}
      ${(lesson.resources || []).map(r => `<span class="badge">${escapeHtml(r.title || r.file_name || 'resource')}</span>`).join('')}
    </div>
  ` : '';
  document.getElementById(elId).innerHTML = `${meta}<article class="prose">${html}</article>`;
}

async function openGuide(g) {
  const reader = document.getElementById('reader');
  if (!g.text_file) {
    window.open(g.file, '_blank');
    return;
  }
  try {
    const r = await fetch(g.text_file);
    const text = await r.text();
    reader.innerHTML = `
      <div class="reader-meta">
        <span class="badge accent">Guide</span>
        <span class="badge">${escapeHtml((g.ext||'').toUpperCase())}</span>
        <a href="${g.file}" download class="badge" style="cursor:pointer">↓ Download original</a>
      </div>
      <article class="prose">
        <h1>${escapeHtml(g.name)}</h1>
        ${escapeHtml(text).split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}
      </article>
    `;
  } catch(e) {
    reader.innerHTML = `<div class="empty"><p>Failed to load. <a href="${g.file}" download>Download original</a></p></div>`;
  }
}

async function openTranscript(t) {
  const reader = document.getElementById('reader');
  try {
    const r = await fetch(t.file);
    const text = await r.text();
    reader.innerHTML = `
      <div class="reader-meta">
        <span class="badge accent">Transcript</span>
        <a href="${t.file}" download class="badge" style="cursor:pointer">↓ Download</a>
      </div>
      <article class="prose">
        <h1>${escapeHtml(t.name.replace(/_/g,' '))}</h1>
        <pre style="white-space: pre-wrap; font-family: 'Inter', sans-serif; background: var(--bg-2); padding: 20px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; line-height: 1.7;">${escapeHtml(text)}</pre>
      </article>
    `;
  } catch(e) {
    reader.innerHTML = `<div class="empty"><p>Failed to load transcript.</p></div>`;
  }
}

async function openMarkdown(file, title) {
  try {
    const r = await fetch(file);
    const md = await r.text();
    const html = marked.parse(md, { gfm: true, breaks: true });
    app.innerHTML = `
      <section class="view">
        <div class="container">
          <button class="back-btn" onclick="goHome()">← Back</button>
          <div class="reader"><article class="prose">${html}</article></div>
        </div>
      </section>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) {
    console.error(e);
  }
}

function renderSearch() {
  const q = searchQuery;
  if (!DATA) return;
  const courseHits = DATA.courses.filter(c =>
    (c.title + ' ' + (c.subtitle||'') + ' ' + (c.description||'')).toLowerCase().includes(q)
  );
  const lessonHits = [];
  for (const c of DATA.courses) {
    for (const l of c.lessons) {
      if ((l.title || '').toLowerCase().includes(q)) {
        lessonHits.push({ course: c, lesson: l });
      }
    }
  }
  const postHits = (DATA.all_posts || []).filter(p => (p.title || '').toLowerCase().includes(q)).slice(0, 30);

  app.innerHTML = `
    <section class="section">
      <div class="container">
        <div class="section-head"><h2>Search results</h2><p>"${escapeHtml(q)}" · ${courseHits.length + lessonHits.length + postHits.length} matches</p></div>
        ${courseHits.length ? `<div class="search-result-cat">Courses (${courseHits.length})</div><div class="grid grid-3">${courseHits.slice(0,9).map(courseCard).join('')}</div>` : ''}
        ${lessonHits.length ? `<div class="search-result-cat">Lessons (${lessonHits.length})</div><div class="calls-list">
          ${lessonHits.slice(0,30).map(({course, lesson}) => `
            <button class="call-item" onclick='openCourse("${course.id}", ${JSON.stringify(lesson.file)})'>
              <div class="call-date">${escapeHtml(course.icon)}</div>
              <div class="call-content">
                <div class="call-title">${escapeHtml(lesson.title)}</div>
                <div class="call-section">${escapeHtml(course.title)} ${lesson.section ? '· ' + escapeHtml(lesson.section) : ''}</div>
              </div>
            </button>
          `).join('')}
        </div>` : ''}
        ${postHits.length ? `<div class="search-result-cat">Community posts (${postHits.length})</div><div class="posts-list">${postHits.map(postRow).join('')}</div>` : ''}
      </div>
    </section>
  `;
}

loadData();
</script>
</body>
</html>
